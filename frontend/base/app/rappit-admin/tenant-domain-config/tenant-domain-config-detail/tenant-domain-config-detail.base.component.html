<div class="detail tenant-domain-config-detail">

    <div class="w-100" *ngIf="showBreadcrumb"> <app-breadcrumb></app-breadcrumb></div>
    <div id="title-bar">
        <div class="display">
            <div class="col" class="page-title-bar"
                *ngIf="((isMobile && !isSearchFocused) || !isMobile) && !hideListPageTitle">
                <span class="page-title" [pTooltip]="isMobile ? (pageViewTitle | translate) : null"
                    [innerHTML]="pageViewTitle | translate"></span>
            </div>

            <app-action-bar [buttons]="isMobile? combinedActionConfig:leftActionBarConfig.children"
                (onBtnClick)='actionBarAction($event)' [style.order]="isMobile?'1':'0'" actionBarName="leftActionBar"
                [isRowSelected]="isRowSelected" [isChildListpage]="isChildPage" [isListPage]="isList"
                [detailConditionalButtons]="conditionalActions" [filterActionButtons]="filterActions">
            </app-action-bar>

        </div>
    </div>

    <div class="ev-detail-view" id="detail-view-container">
        <div class="detail-flex-box">
            <div class="flex align-items-center justify-content-center wizard-container col-2"
                *ngIf="wizardItems?.length && showScrollSpy" id="detail-wizard">
                <p-tieredMenu #menu [model]="wizardItems"></p-tieredMenu>
            </div>
            <div class="missing-filters-banner" *ngIf="!showForm">
                <i class="pi pi-exclamation-triangle"></i>
                <span [innerHtml]="filtersEmptyMsg">
                </span>
            </div>
            <div class="flex align-items-center justify-content-center form-container" *ngIf="showForm">
                <form class="ev-form " [formGroup]="detailFormControls" #detailForm
                    [ngClass]="{'read-only-fields':enableReadOnly,  'read-only-form':!tableaccess}">
                    <div class="row form-body">
                        <div class="form-row vg-col-2">
                            <div class="form-col" id="domain">
                                <div class="field-row"
                                    [ngClass]="{'required': formFieldConfig?.domain?.isRequired, 'error':inValidFields.domain}">
                                    <label for="domain" class="col-form-label domain-label"
                                        [textContent]=" 'Domain'|translate "></label>
                                    <span class="info-bubble" *ngIf="formFieldConfig?.domain?.infoBubble"
                                        [pTooltip]="(formFieldConfig?.domain?.infoBubble|translate) || ''"><i
                                            class="fa fa-circle-info"></i></span>
                                    <input type="text" pInputText class="form-control domain-name"
                                        formControlName="domain"
                                        [placeholder]="(formFieldConfig?.domain?.placeHolder|translate) || ''"
                                        [maxlength]="formFieldConfig?.domain?.maxLength" />
                                    <div class="fst-italic fs-5 help-text">
                                        {{(formFieldConfig?.domain?.helpText|translate) || ''}}</div>
                                </div>
                            </div>
                            <div class="form-col org-container" id="organization">
                                <div class="field-row"
                                    [ngClass]="{'required': formFieldConfig?.organization?.isRequired, 'error':inValidFields.organization}">
                                    <label for="organization" class="col-form-label domain-label"
                                        [textContent]=" 'Organization'|translate "></label>
                                    <span class="info-bubble" *ngIf="formFieldConfig?.organization?.infoBubble"
                                        [pTooltip]="(formFieldConfig?.organization?.infoBubble|translate) || ''"><i
                                            class="fa fa-circle-info"></i></span>
                                    <input type="text" pInputText class="form-control domain-name"
                                        formControlName="orgname"
                                        [placeholder]="(formFieldConfig?.organization?.placeHolder|translate) || ''"
                                        [maxlength]="formFieldConfig?.organization?.maxLength" />
                                    <div class="fst-italic fs-5 help-text">
                                        {{(formFieldConfig?.organization?.helpText|translate) || ''}}</div>
                                </div>
                            </div>
                            <div class="form-col tenants-container" id="tenants">
                                <div class="field-row"
                                    [ngClass]="{'required': formFieldConfig?.tenants?.isRequired, 'error':inValidFields.tenants}">
                                    <label for="tenant" class="col-form-label tenant-label"
                                        [textContent]=" 'Tenants'|translate "></label>
                                    <p-dropdown [options]="tenants" formControlName="tenant"
                                        [placeholder]="('Select a tenant'|translate) || ''" optionValue="tenantId"
                                        [ngClass]="{'error':inValidFields.tenants}" appendTo="body" (onShow)="onTenantDropdownShow($event)">
                                        <ng-template pTemplate="item" let-tenant>
                                            {{tenant.tenantId}} ({{tenant.tenantName}})
                                        </ng-template>
                                        <ng-template pTemplate="selectedItem" let-tenant>
                                            {{tenant.tenantId}} ({{tenant.tenantName}})
                                        </ng-template>
                                    </p-dropdown>
                                </div>
                            </div>

                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
